
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer Form</title>
</head>
<body>

    <h1>Volunteer Form</h1>

    <form action="http://bloomingdale.sat.iit.edu/kriedan/lab3formscript.php"
          method="post">

        <fieldset>
            <legend>My Info</legend>

            <label for="first_name">First Name:</label>
            <input type="text" id="first_name"
                   name="first_name_field"><br>

            <label for="last_name">Last Name:</label>
            <input type="text" id="last_name"
                   name="last_name_field"><br>

            <label for="phone">Phone:</label>
            <input type="tel" id="phone"
                   name="phone_field"><br>

            <label for="email">Email:</label>
            <input type="email" id="email"
                   name="email_field"><br>

            <span>Gender:</span><br>
            <input type="radio" id="male"
                   name="gender_field" value="Male">
            <label for="male">Male</label>

            <input type="radio" id="female"
                   name="gender_field" value="Female">
            <label for="female">Female</label><br>

            <label for="age">Age:</label>
            <select id="age" name="age_field">
                <option value="under 18">under 18</option>
                <option value="18-25">18-25</option>
                <option value="26-35">26-35</option>
                <option value="36-45">36-45</option>
                <option value="46+">46+</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>My Availability</legend>

            <h2>Days Available:</h2>

            <input type="checkbox" id="sunday"
                   name="available_field[]" value="Sunday">
            <label for="sunday">Sunday</label><br>

            <input type="checkbox" id="monday"
                   name="available_field[]" value="Monday">
            <label for="monday">Monday</label><br>

            <input type="checkbox" id="tuesday"
                   name="available_field[]" value="Tuesday">
            <label for="tuesday">Tuesday</label><br>

            <input type="checkbox" id="wednesday"
                   name="available_field[]" value="Wednesday">
            <label for="wednesday">Wednesday</label><br>

            <input type="checkbox" id="thursday"
                   name="available_field[]" value="Thursday">
            <label for="thursday">Thursday</label><br>

            <input type="checkbox" id="friday"
                   name="available_field[]" value="Friday">
            <label for="friday">Friday</label><br>

            <input type="checkbox" id="saturday"
                   name="available_field[]" value="Saturday">
            <label for="saturday">Saturday</label><br>

            <h2><label for="comments">Comments</label></h2>
            <textarea id="comments" name="comments_field"
                      rows="4" cols="30"></textarea>
        </fieldset>

        <input type="hidden" name="hidden_field"
               value="Huthef Abdirizak">

        <input type="submit" value="Submit Query">

    </form>

</body>
</html>
